<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>System design de Longa</title>
<desc>Architecture RAG de Longa : ingestion offline des PDF vers FAISS, pipeline RAG en ligne, et évaluation RAGAS.</desc>
<style>
text{font-family:Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.cont{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
.p rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1} .p .th{fill:#3C3489} .p .ts{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1} .t .th{fill:#085041} .t .ts{fill:#0F6E56}
.g rect,.g circle{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1} .g .th{fill:#444441} .g .ts{fill:#5F5E5A}
.d rect{stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#FFFFFF"/>

<rect class="cont" x="30" y="20" width="620" height="110" rx="12"/>
<text class="th" x="46" y="40">Ingestion pipeline (offline, ingest.py)</text>
<g class="p"><rect x="50" y="56" width="130" height="56" rx="8"/><text class="th" x="115" y="74" text-anchor="middle" dominant-baseline="central">PDF sources</text><text class="ts" x="115" y="92" text-anchor="middle" dominant-baseline="central">data/ folder</text></g>
<g class="p"><rect x="200" y="56" width="130" height="56" rx="8"/><text class="th" x="265" y="74" text-anchor="middle" dominant-baseline="central">Chunking</text><text class="ts" x="265" y="92" text-anchor="middle" dominant-baseline="central">chunk 1000/150</text></g>
<g class="p"><rect x="350" y="56" width="130" height="56" rx="8"/><text class="th" x="415" y="74" text-anchor="middle" dominant-baseline="central">Embeddings</text><text class="ts" x="415" y="92" text-anchor="middle" dominant-baseline="central">mpnet 768d</text></g>
<g class="g"><rect x="500" y="56" width="130" height="56" rx="8"/><text class="th" x="565" y="74" text-anchor="middle" dominant-baseline="central">FAISS index</text><text class="ts" x="565" y="92" text-anchor="middle" dominant-baseline="central">on disk</text></g>
<line class="arr" x1="182" y1="84" x2="198" y2="84"/>
<line class="arr" x1="332" y1="84" x2="348" y2="84"/>
<line class="arr" x1="482" y1="84" x2="498" y2="84"/>

<rect class="cont" x="30" y="160" width="620" height="250" rx="12"/>
<text class="th" x="46" y="180">RAG pipeline (runtime)</text>
<g class="t"><rect x="50" y="200" width="130" height="56" rx="8"/><text class="th" x="115" y="218" text-anchor="middle" dominant-baseline="central">Streamlit UI</text><text class="ts" x="115" y="236" text-anchor="middle" dominant-baseline="central">chat interface</text></g>
<g class="t"><rect x="275" y="200" width="130" height="56" rx="8"/><text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central">Query encoder</text><text class="ts" x="340" y="236" text-anchor="middle" dominant-baseline="central">mpnet 768d</text></g>
<g class="t"><rect x="500" y="200" width="130" height="56" rx="8"/><text class="th" x="565" y="218" text-anchor="middle" dominant-baseline="central">FAISS retriever</text><text class="ts" x="565" y="236" text-anchor="middle" dominant-baseline="central">MMR k=6</text></g>
<g class="t"><rect x="500" y="320" width="130" height="56" rx="8"/><text class="th" x="565" y="338" text-anchor="middle" dominant-baseline="central">Prompt builder</text><text class="ts" x="565" y="356" text-anchor="middle" dominant-baseline="central">grounding rules</text></g>
<g class="t"><rect x="275" y="320" width="130" height="56" rx="8"/><text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">LLM generation</text><text class="ts" x="340" y="356" text-anchor="middle" dominant-baseline="central">Llama via Groq</text></g>
<g class="t"><rect x="50" y="320" width="130" height="56" rx="8"/><text class="th" x="115" y="338" text-anchor="middle" dominant-baseline="central">Answer + sources</text><text class="ts" x="115" y="356" text-anchor="middle" dominant-baseline="central">cited chunks</text></g>
<line class="arr" x1="182" y1="228" x2="273" y2="228"/>
<line class="arr" x1="407" y1="228" x2="498" y2="228"/>
<line class="arr" x1="565" y1="198" x2="565" y2="114"/>
<line class="arr" x1="565" y1="258" x2="565" y2="318"/>
<line class="arr" x1="498" y1="348" x2="407" y2="348"/>
<line class="arr" x1="273" y1="348" x2="182" y2="348"/>
<line class="arr" x1="115" y1="318" x2="115" y2="258"/>
<g class="g"><circle cx="226" cy="208" r="9"/><text class="ts" x="226" y="208" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="g"><circle cx="452" cy="208" r="9"/><text class="ts" x="452" y="208" text-anchor="middle" dominant-baseline="central">2</text></g>
<g class="g"><circle cx="585" cy="145" r="9"/><text class="ts" x="585" y="145" text-anchor="middle" dominant-baseline="central">3</text></g>
<g class="g"><circle cx="585" cy="288" r="9"/><text class="ts" x="585" y="288" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="g"><circle cx="452" cy="328" r="9"/><text class="ts" x="452" y="328" text-anchor="middle" dominant-baseline="central">5</text></g>
<g class="g"><circle cx="226" cy="328" r="9"/><text class="ts" x="226" y="328" text-anchor="middle" dominant-baseline="central">6</text></g>
<g class="g"><circle cx="135" cy="288" r="9"/><text class="ts" x="135" y="288" text-anchor="middle" dominant-baseline="central">7</text></g>

<rect class="cont" x="30" y="440" width="620" height="112" rx="12"/>
<text class="th" x="46" y="460">Evaluation and observability</text>
<g class="p"><rect x="50" y="476" width="130" height="56" rx="8"/><text class="th" x="115" y="494" text-anchor="middle" dominant-baseline="central">Golden dataset</text><text class="ts" x="115" y="512" text-anchor="middle" dominant-baseline="central">11 reference Qs</text></g>
<g class="p"><rect x="200" y="476" width="130" height="56" rx="8"/><text class="th" x="265" y="494" text-anchor="middle" dominant-baseline="central">RAGAS eval</text><text class="ts" x="265" y="512" text-anchor="middle" dominant-baseline="central">4 metrics</text></g>
<g class="p"><rect x="350" y="476" width="130" height="56" rx="8"/><text class="th" x="415" y="494" text-anchor="middle" dominant-baseline="central">Reports</text><text class="ts" x="415" y="512" text-anchor="middle" dominant-baseline="central">eval_results/</text></g>
<g class="g d"><rect x="500" y="476" width="130" height="56" rx="8"/><text class="th" x="565" y="494" text-anchor="middle" dominant-baseline="central">User feedback</text><text class="ts" x="565" y="512" text-anchor="middle" dominant-baseline="central">planned</text></g>
<line class="arr" x1="182" y1="504" x2="198" y2="504"/>
<line class="arr" x1="332" y1="504" x2="348" y2="504"/>
<line class="arr" style="stroke-dasharray:4 4" x1="300" y1="474" x2="300" y2="378"/>

<g class="p"><rect x="40" y="574" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="580" dominant-baseline="central">Offline</text>
<g class="t"><rect x="140" y="574" width="12" height="12" rx="2"/></g><text class="ts" x="158" y="580" dominant-baseline="central">Runtime</text>
<g class="g"><rect x="250" y="574" width="12" height="12" rx="2"/></g><text class="ts" x="268" y="580" dominant-baseline="central">Storage / planned</text>
</svg>
